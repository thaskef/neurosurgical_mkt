<html>
<head><meta charset="utf-8" /><style>
html,body{height:100%;margin:0;overflow:hidden;}

.insight-btn {
  position: fixed; bottom: 16px; right: 20px; z-index: 200;
  background: #0d1b2a; color: #e94560; border: 1px solid #1a508b;
  border-radius: 8px; padding: 8px 16px; cursor: pointer;
  font-size: 13px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.insight-btn:hover { background: #1a2d44; border-color: #2a6ab5; color: #ff6b81; }
.insight-btn .icon { font-size: 16px; font-style: normal; }
.insight-overlay {
  display: none; position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.6); justify-content: center; align-items: center;
}
.insight-overlay.open { display: flex; }
.insight-popup {
  background: #0d1b2a; border: 1px solid #1a508b; border-radius: 10px;
  max-width: 700px; width: 90%; max-height: 70vh; overflow-y: auto;
  padding: 24px 28px; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  position: relative;
}
.insight-popup .popup-label {
  color: #e94560; font-size: 14px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 12px;
}
.insight-popup .popup-text {
  color: #ddd; font-size: 15px; line-height: 1.65;
}
.insight-popup .popup-close {
  position: absolute; top: 10px; right: 14px;
  background: none; border: none; color: #888; font-size: 22px;
  cursor: pointer; line-height: 1;
}
.insight-popup .popup-close:hover { color: #fff; }
</style>
</head>
