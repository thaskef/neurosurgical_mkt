<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Neurosurgery Deck — Figures</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; }
#app { display: none; }
#gate { display: flex; align-items: center; justify-content: center; height: 100vh; background: #1a1a2e; }
#gate div { text-align: center; }
#gate h1 { font-size: 28px; margin-bottom: 8px; color: #e94560; }
#gate p { color: #888; font-size: 13px; margin-bottom: 20px; }
#gate input { background: #0f3460; color: #eee; border: 1px solid #1a508b; padding: 12px 18px; font-size: 16px; border-radius: 5px; width: 260px; text-align: center; outline: none; }
#gate input:focus { border-color: #e94560; }
#gate .err { color: #e94560; font-size: 12px; margin-top: 8px; display: none; }
nav { background: #16213e; display: flex; flex-wrap: wrap; gap: 2px; padding: 8px; position: sticky; top: 0; z-index: 10; align-items: center; }
nav select { background: #0f3460; color: #eee; border: 1px solid #1a508b; padding: 8px 12px; font-size: 13px; border-radius: 5px; margin-right: 8px; cursor: pointer; }
nav select:focus { outline: none; border-color: #e94560; }
nav .sep { width: 1px; height: 24px; background: #333; margin: 0 4px; }
nav button { background: #0f3460; color: #ccc; border: none; padding: 10px 18px; cursor: pointer; font-size: 13px; border-radius: 5px; transition: all 0.15s; }
nav button:hover { background: #1a508b; color: #fff; }
nav button.active { background: #e94560; color: #fff; font-weight: 600; }
.frame-wrap { position: relative; width: 100%; height: calc(100vh - 52px); overflow: hidden; }
.frame-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
.counter { position: absolute; top: 10px; right: 16px; background: rgba(0,0,0,0.7); color: #aaa; font-size: 11px; padding: 4px 10px; border-radius: 10px; }
</style>
</head>
<body>

<div id="gate">
  <div>
    <h1>Neurosurgery Deck</h1>
    <p>Enter password to view figures</p>
    <input type="password" id="pw" placeholder="Password" autofocus onkeydown="if(event.key==='Enter')tryAuth()">
    <div class="err" id="err">Incorrect password</div>
  </div>
</div>

<div id="app">
<nav>
  <select id="mode" onchange="switchMode()">
    <option value="drugs">Drugs</option>
    <option value="devices">Devices</option>
  </select>
  <span class="sep"></span>
  <span id="buttons"></span>
</nav>

<div class="frame-wrap">
  <iframe id="viewer" src="fig1_combined.html?v=11"></iframe>
  <div class="counter" id="counter">1 / 6</div>
</div>
</div>

<script>
// ── Password gate ──
const PW_HASH = 'd42e821035b7233cf2c8f616554a9c6fd3fdfba0530f3ba8fecda21f945d6c8b';
const encoder = new TextEncoder();

async function sha256hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', encoder.encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function tryAuth() {
  const input = document.getElementById('pw').value;
  const hash = await sha256hex(input);
  if (hash === PW_HASH) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pw').value = '';
  }
}

// ── Figure config ──
const V = '11'; // cache buster version

const drugCfg = {
  labels: [
    '1. Revenue Bars',
    '2. Incidence vs Growth',
    '3. Pipeline Intensity',
    '4. Company Matrix',
    '5. Ownership Profile',
    '6. Capital Table'
  ],
  files: [
    'fig1_combined.html?v=' + V,
    'fig2_combined.html?v=' + V,
    'fig3_pipeline_intensity.html?v=' + V,
    'fig4_company_matrix.html?v=' + V,
    'fig5_ownership_profile.html?v=' + V,
    'fig6_capital_map.html?v=' + V
  ]
};

const deviceCfg = {
  labels: [
    '1. Device Pipeline',
    '2. Equipment Heatmap',
    '3. Ownership Profile',
    '4. Launch Timeline',
    '5. Regulatory Pathway',
    '6. Market Size',
    '7. Neuromodulation Segments'
  ],
  files: [
    'fig7_devices_pipeline.html?v=' + V,
    'fig8_device_equipment_heatmap.html?v=' + V,
    'fig9_device_ownership.html?v=' + V,
    'fig10_device_timeline.html?v=' + V,
    'fig11_regulatory_pathway.html?v=' + V,
    'fig12_device_market_bars.html?v=' + V,
    'fig13_neuromodulation_segments.html?v=' + V
  ]
};

let currentMode = 'drugs';
let currentIdx = 0;

function getCfg() {
  return currentMode === 'drugs' ? drugCfg : deviceCfg;
}

function renderButtons() {
  const cfg = getCfg();
  const container = document.getElementById('buttons');
  container.innerHTML = cfg.labels.map((l, i) =>
    '<button class="' + (i === currentIdx ? 'active' : '') + '" onclick="show(' + i + ')">' + l + '</button>'
  ).join('');
}

function show(n) {
  currentIdx = n;
  const cfg = getCfg();
  document.querySelectorAll('#buttons button').forEach((b, i) => b.classList.toggle('active', i === n));
  document.getElementById('viewer').src = cfg.files[n];
  document.getElementById('counter').textContent = (n + 1) + ' / ' + cfg.files.length;
}

function switchMode() {
  currentMode = document.getElementById('mode').value;
  currentIdx = 0;
  renderButtons();
  show(0);
}

// Init
function init() {
  renderButtons();
  show(0);

  // Keyboard nav
  document.addEventListener('keydown', e => {
    const cfg = getCfg();
    if (e.key === 'ArrowRight' && currentIdx < cfg.files.length - 1) show(currentIdx + 1);
    if (e.key === 'ArrowLeft' && currentIdx > 0) show(currentIdx - 1);
  });
}
</script>
</body>
</html>
